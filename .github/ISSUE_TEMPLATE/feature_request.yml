name: Feature idea
description: Suggest an improvement to SaltyTrack.
title: "[Idea] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. Issues are public, so please avoid personal information.
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do?
      description: Describe the problem or goal behind the idea.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: Describe your suggestion and where you would use it.
    validations:
      required: true
